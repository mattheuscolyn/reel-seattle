name: Remaining-run shadow forecast

# Research shadow model. Public subset remains explicitly experimental and
# freshness-gated; never changes production Leaving Soon scoring.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
  # Exercise workflow repairs once, without running after every data commit.
  push:
    branches: [main]
    paths:
      - '.github/workflows/remaining_run_shadow.yml'

permissions:
  contents: write

concurrency:
  group: remaining-run-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Checkout immutable PR 141 research inputs
        uses: actions/checkout@v5
        with:
          ref: 95ae5725e74176b94f982cf4454f6b8d0b4b634e
          path: shadow-reference-pr141
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Fit shadow model and append forecasts
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/run_remaining_run_shadow.py --reference-root shadow-reference-pr141 --with-tmdb
      - name: Remove ephemeral frozen reference checkout
        if: always()
        run: rm -rf shadow-reference-pr141
      - name: Export redacted experimental A-List forecast
        run: python scripts/build_a_list_forecast.py
      - name: Commit research and redacted A-List artifact
        run: |
          git add data/model_predictions/remaining_run_shadow data/models/remaining_run_shadow data/history/remaining_run_forecasts.jsonl.gz data/history/remaining_run_forecast_evaluation.jsonl.gz data/history/tmdb_dynamic_snapshots.jsonl.gz data/history/tmdb_stable_enrichment.jsonl.gz data/audits/remaining_run_shadow public/data/a_list_run_forecast_current.json
          if git diff --cached --quiet; then
            echo "No shadow changes."
            exit 0
          fi
          git -c user.name="reel-seattle-shadow" -c user.email="shadow@users.noreply.github.com" commit -m "Record the daily remaining-run shadow forecast."
          git push
