name: Market V3 prospective shadow (isolated)

# Main-only scheduled execution. Never updates public Leaving Soon or A-List.
# PRs bootstrap in the runner and run the complete path without persistence.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main, research/remaining-run-market-features-v3]
    paths:
      - ".github/workflows/remaining_run_market_v3_shadow.yml"
      - "reel_seattle/analysis/remaining_run_market_publication.py"
      - "reel_seattle/analysis/remaining_run_market_features.py"
      - "scripts/bootstrap_remaining_run_market_v3.py"
      - "scripts/run_market_v3_shadow.py"
      - "scripts/evaluate_market_v3_prospective.py"
      - "tests/analysis/test_market_v3_shadow.py"
      - "tests/analysis/test_market_v3_promotion.py"
      - "scripts/market_v3_public_adapter.py"
      - "scripts/manage_market_v3_promotion.py"
      - "scripts/build_a_list_forecast.py"
      - "v2/planner/aListRecommendationEngine.js"
  push:
    branches: [main]
    paths:
      - ".github/workflows/remaining_run_market_v3_shadow.yml"

permissions:
  contents: write

concurrency:
  group: market-v3-shadow-${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
  cancel-in-progress: false

jobs:
  prospective:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Test market model, selector, provenance, and immutable ledger
        run: |
          python -m pytest -q tests/analysis/test_remaining_run_market_features.py tests/analysis/test_evaluate_remaining_run_market_v3.py tests/analysis/test_market_v3_shadow.py tests/analysis/test_market_v3_promotion.py tests/test_a_list_public_feeds.py
      - name: Check experimental A-List recommendation compatibility
        run: node --test tests/frontend/v2AListRecommendationEngine.test.mjs
      - name: Freeze challenger only when no pinned candidate exists
        run: |
          if [ ! -f data/models/remaining_run_shadow/market_v3_candidate.json ]; then
            python -m scripts.bootstrap_remaining_run_market_v3
          fi
      - name: Produce frozen-model daily shadow forecasts
        run: python -m scripts.run_market_v3_shadow
      - name: Resolve matured forecasts against independently complete AMC evidence
        run: python -m scripts.evaluate_market_v3_prospective
      - name: Publish redacted Market V3 only when manually activated
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          pointer = Path("data/models/remaining_run_shadow/market_routing.json")
          state = json.loads(pointer.read_text()) if pointer.exists() else {}
          if state.get("active_model") == "remaining_run_market_v3_prospective_1":
              subprocess.run(["python", "scripts/build_a_list_forecast.py"], check=True)
          else:
              print("Shadow only; public A-List forecast unchanged")
          PY
      - name: Upload diagnostic forecast and promotion gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-v3-prospective-shadow
          path: |
            data/models/remaining_run_shadow/market_v3_candidate.json
            data/model_predictions/remaining_run_market_v3/current.json
            data/audits/remaining_run_market_v3_prospective.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve frozen candidate, immutable forecasts and verified settlements
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git add \
            data/models/remaining_run_shadow/market_v3_candidate.json \
            data/model_predictions/remaining_run_market_v3/current.json \
            data/history/remaining_run_market_v3_predictions.jsonl.gz \
            data/history/remaining_run_market_v3_outcomes.jsonl.gz \
            data/audits/remaining_run_market_v3_prospective.json \\
            public/data/a_list_run_forecast_current.json
          if git diff --cached --quiet; then
            echo "No new forecast or outcome evidence"
            exit 0
          fi
          git -c user.name="reel-seattle-shadow" -c user.email="shadow@users.noreply.github.com" \
            commit -m "Archive Market v3 prospective shadow evidence"
          git pull --rebase origin main
          git push origin HEAD:main
