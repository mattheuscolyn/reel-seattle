name: Deploy to GitHub Pages

on:
  schedule:
    - cron: '0 18 * * *'  # 6 PM UTC = 10 AM Pacific
  workflow_dispatch:  # Allow manual triggering
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Production site is the v2 SPA (dist-v2). Legacy `npm run build` → dist/
      # remains available locally for one-commit rollback (see docs/v2/pages-deploy-rollback.md).
      - name: Build v2
        run: npm run build:v2

      - name: Verify dist-v2 artifacts
        run: node scripts/check_dist_v2_artifacts.mjs

      # Browser binaries are not cached by npm; install Chromium for smoke only.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke static dist-v2
        run: npm run smoke:v2:static
        env:
          SKIP_V2_BUILD: '1'

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-v2
          # Preserve www.reelseattle.com on orphan gh-pages publishes.
          cname: www.reelseattle.com
          force_orphan: true
