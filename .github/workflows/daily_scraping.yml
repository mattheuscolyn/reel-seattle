name: Daily Showtime Scraping

on:
  schedule:
    # Run daily at 6 AM UTC (10 PM PST)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up AMC API key
        env:
          AMC_API_KEY: ${{ secrets.AMC_API_KEY }}
        run: |
          echo "AMC_API_KEY=$AMC_API_KEY" >> $GITHUB_ENV

      - name: Run daily scraping
        run: python run_daily_scraping.py

      - name: Validate public data artifacts
        run: python scripts/validate_public_data_artifacts.py

      - name: Validate history CSV
        run: python scripts/validate_history_csv.py --strict

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/history/showtimes_history.csv
          git add data/daily_logs/
          git add data/theaters.json
          git add public/data/showtimes_current.json
          git add public/data/pipeline_report.json
          git add public/data/theaters.json
          git add public/data/movies_announcements.csv
          git add public/data/newly_announced.csv
          git add public/data/newly_added_current.json
          git add public/data/leaving_soon_current.json
          git add public/showtimes.csv
          git add public/indieshowtimes.csv
          git add public/marathon/
          git commit -m "Daily showtime data update $(date +%Y-%m-%d)" || exit 0
          git push
