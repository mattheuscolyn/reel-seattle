name: Daily Showtime Scraping

# Production order for a normal showtime publication run:
#   1. scrape / ingest (run_daily_scraping.py → daily_processor.py)
#   2. normalize titles + screening qualifiers / parent identity (emit path)
#   3. resolve film identity from durable catalog + reviewed decisions
#      (attach_public_film_ids inside write_showtimes_current — not a live TMDB match)
#   4. emit showtimes_current.json with nullable film_id
#   5. frozen Leaving Soon inference against the new AMC all-announced log
#      (inside daily_processor; skipped if restate_safe=false / stale / incomplete)
#   6. validate public artifacts (includes film_id attach regression gate)
#   7. commit/publish showtimes (+ Leaving Soon snapshot / public artifact when published)
#
# Downstream automated workflows (intentionally separate so failures never block showtimes):
#   - 07:00 UTC: Film identity matching (film_identity_match.yml) - matches new films
#   - 08:00 UTC: TMDB enrichment (film_enrichment.yml) - fetches metadata for matched films

on:
  schedule:
    # Run daily at 6 AM UTC (10 PM PST)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up AMC API key
        env:
          AMC_API_KEY: ${{ secrets.AMC_API_KEY }}
        run: |
          echo "AMC_API_KEY=$AMC_API_KEY" >> $GITHUB_ENV

      - name: Run daily scraping
        # Indie collection (SIFF, Beacon, NWFF, Central Cinema) runs inside
        # webscrapetheaters.py via run_daily_scraping.py. Option C logs land in
        # data/daily_logs/ for NWFF and Central Cinema.
        # daily_processor → write_showtimes_current → attach_public_film_ids.
        run: python run_daily_scraping.py

      - name: Validate public data artifacts
        run: python scripts/validate_public_data_artifacts.py

      - name: Validate history CSV
        run: python scripts/validate_history_csv.py --strict

      - name: Refresh AMC source catalog
        env:
          AMC_API_KEY: ${{ secrets.AMC_API_KEY }}
        run: |
          python scripts/run_daily_amc_source_catalog.py \
            --discovery-source auto \
            --policy all-active \
            --products-path data/source_catalog/amc_movie_products.json \
            --releases-path data/source_catalog/amc_release_observations.json \
            --pipeline-report-path public/data/pipeline_report.json \
            --temp-dir "${{ runner.temp }}/amc-source-catalog"

      - name: Re-validate public data artifacts after catalog health update
        run: python scripts/validate_public_data_artifacts.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/history/showtimes_history.csv
          git add data/daily_logs/
          git add data/theaters.json
          if [ -f data/source_catalog/amc_movie_products.json ]; then
            git add data/source_catalog/amc_movie_products.json
          fi
          if [ -f data/source_catalog/amc_release_observations.json ]; then
            git add data/source_catalog/amc_release_observations.json
          fi
          git add public/data/showtimes_current.json
          git add public/data/pipeline_report.json
          git add public/data/theaters.json
          git add public/data/movies_announcements.csv
          git add public/data/newly_announced.csv
          git add public/data/newly_added_current.json
          git add public/data/leaving_soon_current.json
          if [ -d data/model_predictions/leaving_soon ]; then
            git add data/model_predictions/leaving_soon/
          fi
          if [ -f data/audits/tmdb_public_identity_emit.json ]; then
            git add data/audits/tmdb_public_identity_emit.json
          fi
          git add public/showtimes.csv
          git add public/indieshowtimes.csv
          git add public/marathon/
          git commit -m "Daily showtime data update $(date +%Y-%m-%d)" || exit 0
          git push
