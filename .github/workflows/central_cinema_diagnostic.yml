name: Central Cinema HTML structure diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/central_cinema_diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public showtime markup
        run: |
          python -m pip install beautifulsoup4
          python - <<'PY'
          import re, urllib.request
          from bs4 import BeautifulSoup
          url = 'https://central-cinema.com/movie/planes-trains-and-automobiles/'
          req = urllib.request.Request(url, headers={'User-Agent': 'ReelSeattle-CentralCinema-Adapter/0.1 (+https://github.com/mattheuscolyn/reel-seattle; read-only showtimes research)'})
          with urllib.request.urlopen(req, timeout=25) as response:
              html = response.read().decode('utf-8','replace')
          soup=BeautifulSoup(html,'html.parser')
          anchors = [a for a in soup.find_all('a',href=True) if '/checkout/showing/' in a.get('href','')]
          print('TOTAL HTML BYTES', len(html), 'CHECKOUT ANCHORS', len(anchors))
          for a in anchors[:4]:
              print('ANCHOR',str(a))
              node=a.parent.parent
              print('BEFORE UL:', [str(x)[:500] for x in list(node.previous_siblings)[-5:]])
              print('PARENT CONTENT:', str(node.parent).split('<ul>')[0][-2200:])
          for a in anchors[:0]:
              print('\n=== SHOWTIME ===')
              print('anchor',str(a)[:900])
              node=a
              for depth in range(1,5):
                  node=node.parent
                  if node is None: break
                  print('parent',depth,'tag',node.name,'attrs',repr(node.attrs)[:350],'text',node.get_text(' ',strip=True)[:550],'html',str(node)[:1600])
          PY

      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Live validate updated Central Cinema adapter
        run: |
          python -m pip install -r requirements-dev.txt
          python - <<'PY'
          from reel_seattle.adapters.central_cinema import fetch_central_cinema
          result = fetch_central_cinema(sleep_seconds=0.35)
          print("STATUS", result.contract.get("status"))
          print("RESTATE_SAFE", result.restate_safe)
          print("DISCOVERED", result.contract.get("stats", {}).get("discovered_programs"))
          print("RECORDS", len(result.records))
          print("REJECTED", result.contract.get("rejected_observations"))
          for row in result.records[:12]:
              print("SHOWTIME", row.title_raw, row.date_raw, row.time_raw, row.source_showtime_id)
          assert result.restate_safe, "Live Central Cinema scrape still incomplete"
          assert len(result.records) >= 5, "Unexpectedly few live showtimes"
          PY
