name: Coming Soon Live Source Audit

# Temporary investigation workflow for the Coming Soon data spike.
#
# Runs the credentialed AMC catalog probe and the live TMDB US theatrical
# query, then builds the combined Coming Soon evidence audit. Read-only with
# respect to the repository: it never commits, never publishes
# public/data/coming_soon_current.json, and never touches Leaving Soon,
# Opening This Week, or Just Announced.
#
# Secrets are passed as step-scoped env vars, never echoed, never written to
# artifacts, and never persisted in git credentials.
on:
  push:
    branches:
      - cursor/coming-soon-data-spike-6f4e

permissions:
  contents: read

concurrency:
  group: coming-soon-live-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Live AMC + TMDB Coming Soon audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify credential presence
        env:
          AMC_API_KEY: ${{ secrets.AMC_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -u
          missing=0
          for name in AMC_API_KEY TMDB_READ_ACCESS_TOKEN TMDB_API_KEY; do
            # Presence only: the value itself is never expanded into the log.
            if [ -z "${!name:-}" ]; then
              echo "$name: MISSING"
              missing=1
            else
              echo "$name: present"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more required repository secrets are missing."
            exit 1
          fi

      - name: Run focused Coming Soon tests
        run: python -m pytest tests/test_coming_soon_live_audit.py tests/test_coming_soon.py -q

      - name: Investigate AMC Coming Soon catalog (live)
        env:
          AMC_API_KEY: ${{ secrets.AMC_API_KEY }}
        run: |
          mkdir -p audit-output
          python scripts/investigate_amc_coming_soon_live.py \
            --output-dir audit-output \
            --window-days 90 \
            --page-size 100 \
            --max-pages 40

      - name: Run live TMDB US theatrical query
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python scripts/investigate_tmdb_us_theatrical_live.py \
            --output-dir audit-output \
            --window-days 90 \
            --max-pages 30

      - name: Build combined Coming Soon audit
        run: |
          python scripts/build_coming_soon_live_audit.py \
            --output-dir audit-output \
            --window-days 90 \
            --current-window-days 7 \
            --require-live

      # Runs even when the live-coverage gate above fails, so a failed run still
      # proves its artifacts are clean and still reports what it found.
      - name: Verify artifacts are sanitized
        if: always()
        env:
          AMC_API_KEY: ${{ secrets.AMC_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/verify_live_audit_sanitized.py --output-dir audit-output

      - name: Publish summary to run output
        if: always()
        run: cat audit-output/coming_soon_live_audit_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coming-soon-live-source-audit
          path: |
            audit-output/coming_soon_source_audit_live.json
            audit-output/amc_coming_soon_endpoint_investigation.json
            audit-output/tmdb_us_theatrical_investigation.json
            audit-output/coming_soon_live_audit_summary.md
          retention-days: 14
          if-no-files-found: error
