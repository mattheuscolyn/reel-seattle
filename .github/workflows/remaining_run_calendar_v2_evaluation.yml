name: Remaining Run calendar v2 research evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/evaluate_remaining_run_calendar_v2.py"
      - "tests/analysis/test_evaluate_remaining_run_calendar_v2.py"
      - ".github/workflows/remaining_run_calendar_v2_evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    name: Matched strict holdout, research-only
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Verify deterministic evaluation invariants
        run: python -m pytest -q tests/analysis/test_evaluate_remaining_run_calendar_v2.py
      - name: Train and evaluate original-label control vs calendar v2
        run: |
          mkdir -p data/audits
          python -m scripts.evaluate_remaining_run_calendar_v2 \
            --output data/audits/remaining_run_calendar_v2_evaluation.json \
            --model data/audits/remaining_run_calendar_v2_candidate_model.json \
            | tee data/audits/remaining_run_calendar_v2_evaluation.log
      - name: Preserve research evaluation only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-run-calendar-v2-research-evaluation
          path: |
            data/audits/remaining_run_calendar_v2_evaluation.json
            data/audits/remaining_run_calendar_v2_candidate_model.json
            data/audits/remaining_run_calendar_v2_evaluation.log
          retention-days: 14
          if-no-files-found: warn
