<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting to Planner — Reel Seattle</title>
    <meta http-equiv="refresh" content="0;url=/planner?count=max&amp;from=marathon" />
    <script>
      /**
       * Static fallback when GitHub Pages serves /marathon/ from this directory.
       * Mirrors buildPlannerPathFromMarathon() in src/utils/plannerUrlState.js.
       */
      (function () {
        var storageKey = 'marathon-planner-filters';
        var params = new URLSearchParams();
        params.set('count', 'max');
        params.set('from', 'marathon');
        try {
          var raw = localStorage.getItem(storageKey);
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && typeof parsed === 'object') {
              var blacklist = Array.isArray(parsed.blacklist) ? parsed.blacklist : [];
              var preferred = Array.isArray(parsed.preferred_movies) ? parsed.preferred_movies : [];
              blacklist.forEach(function (title) {
                var trimmed = String(title).trim();
                if (trimmed) params.append('exclude', trimmed);
              });
              preferred.forEach(function (title) {
                var trimmed = String(title).trim();
                if (trimmed) params.append('preferred', trimmed);
              });
              if (blacklist.length > 0 || preferred.length > 0) {
                params.set('advanced', '1');
              }
            }
          }
        } catch (e) {
          /* ignore malformed localStorage */
        }
        window.location.replace(window.location.origin + '/planner?' + params.toString());
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/planner?count=max&amp;from=marathon">Movie Planner</a>…</p>
  </body>
</html>
